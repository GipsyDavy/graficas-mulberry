# Una tarea H solo puede estar APROBADA con validación ejecutada, todas sus revisiones favorables
# y blockers_open = 0. STATE.md y HANDOFF.md no duplican esta información.
# Tareas nuevas (sin `legacy: true`): `owned_paths` y `base_commit` obligatorios; la autoría se
# contrasta con los trailers `Agent:` de git (`--authorship`). Convocatoria: `requested_by` en la
# revisión y `--pending "<Agente>"` para consultarla.

